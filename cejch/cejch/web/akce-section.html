<section id="akce">
    <h2 class="section-title">{{ t('akce.title') }}</h2>
    <p class="section-subtitle">{{ t('akce.subtitle') }}</p>

    <div class="events-grid" v-if="data.planovane_akce.length > 0">
        <div class="event-card" v-for="event in data.planovane_akce" :key="event.id">
            <img :src="event.img" :alt="event.title" class="event-image">
            <div class="event-content">
                <span class="event-date">{{ t('akce.event_date', { date: event.date }) }}</span>
                <h3>{{ event.title }}</h3>
                <p>{{ event.desc }}</p>
            </div>
        </div>
    </div>
    <div v-else class="empty-state">
        <span class="material-icons-outlined empty-state-icon">event_busy</span>
        <p class="empty-state-text">{{ t('akce.no_events') }}</p>
    </div>
</section>
