<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cejch | Rekreační areál v srdci Českého ráje</title>
    
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Outlined" rel="stylesheet">
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">
    <!-- Sekce budou načteny sem pomocí app.js -->
    
    <!-- Global Lightbox -->
    <div v-if="isLightboxOpen" class="lightbox-overlay" @click.self="closeLightbox" @touchstart="handleTouchStart" @touchend="handleTouchEnd">
        <button class="lightbox-close" @click="closeLightbox" :aria-label="t('lightbox.close')">&times;</button>
        <button class="lightbox-nav prev" @click="prevLightboxImage" v-if="lightboxImages.length > 1" :aria-label="t('lightbox.prev_image')">&lsaquo;</button>
        <div class="lightbox-content">
            <img :src="lightboxImages[activeLightboxIndex]" :alt="lightboxTitle">
            <div class="lightbox-caption">
                <h3>{{ lightboxTitle }}</h3>
                <span>{{ activeLightboxIndex + 1 }} / {{ lightboxImages.length }}</span>
            </div>
        </div>
        <button class="lightbox-nav next" @click="nextLightboxImage" v-if="lightboxImages.length > 1" :aria-label="t('lightbox.next_image')">&rsaquo;</button>
    </div>
</div>

<script src="app.js" defer></script>
</body>
</html>
