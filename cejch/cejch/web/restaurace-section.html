<section id="restaurace" class="bg-white">
    <h2 class="section-title">Poctivá kuchyně</h2>
    <p class="section-subtitle">{{ data.restaurace_info.provoz }}<br>{{ data.restaurace_info.poznamka }}</p>
    <div class="menu-grid">
        <div class="menu-image-wrapper">
            <img src="https://images.unsplash.com/photo-1555396273-367ea4eb4db5?auto=format&fit=crop&w=800&q=80" alt="Restaurace">
        </div>
        <div>
            <h3 class="menu-title">Aktuální jídelní lístek</h3>
            <div class="menu-item-detailed" v-for="item in (showAllMenu ? data.menu : data.menu.slice(0, 5))" :key="item.name">
                <img :src="item.img" class="menu-thumb" v-if="item.img" alt="">
                <div class="menu-info">
                    <div class="menu-item">
                        <span class="menu-item-name">{{ item.name }}</span>
                        <span class="menu-price">{{ item.price }}</span>
                    </div>
                    <p class="menu-desc" v-if="item.desc">{{ item.desc }}</p>
                </div>
            </div>
            <button class="outline" v-if="data.menu.length > 5" @click="showAllMenu = !showAllMenu">
                {{ showAllMenu ? 'Skrýt' : 'Celý seznam' }}
            </button>
        </div>
    </div>

    <!-- Galerie restaurace -->
    <div v-if="data.restaurace_galerie && data.restaurace_galerie.length > 0"
         class="gallery-container" 
         @mouseenter="stopAutoplay" 
         @mouseleave="startAutoplay"
         @touchstart="stopAutoplay"
         @touchend="startAutoplay">
        <button class="gallery-nav-btn prev" @click="scrollGallery(-1)" aria-label="Předchozí">
            <span class="material-icons-outlined">chevron_left</span>
        </button>

        <div class="gallery-grid" @scroll="handleGalleryScroll">
            <div class="gallery-item" v-for="(img, index) in data.restaurace_galerie" :key="index">
                <img :src="img" alt="Galerie restaurace" loading="lazy">
            </div>
        </div>

        <button class="gallery-nav-btn next" @click="scrollGallery(1)" aria-label="Další">
            <span class="material-icons-outlined">chevron_right</span>
        </button>

        <div class="gallery-indicators">
            <button v-for="(_, index) in data.restaurace_galerie" 
                    :key="index" 
                    class="indicator-dot" 
                    :class="{ active: activeGalleryIndex === index }"
                    @click="scrollToImage(index)">
            </button>
        </div>
    </div>
</section>
