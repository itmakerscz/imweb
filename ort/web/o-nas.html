<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>O nás | ORT Nový Bydžov</title>
    <meta name="description" content="Poznejte historii a vizi společnosti ORT Nový Bydžov. Tradice v inženýrství od roku 1994.">

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="assets/styles.css">
    <link rel="stylesheet" href="assets/animations.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0&display=block" />
</head>
<body>
    <div id="app" v-cloak>
        <app-navbar 
            :is-dark-mode="isDarkMode" 
            :is-scrolled="isScrolled" 
            :is-menu-open="isMenuOpen" 
            :nav-items="navItems" 
            :active-section="activeSection"
            :scroll-progress="scrollProgress"
            @toggle-theme="toggleTheme" 
            @toggle-menu="toggleMenu" 
            @close-menu="closeMenu">
        </app-navbar>

        <section class="video-hero">
            <app-hero-coordinates :data="coords"></app-hero-coordinates>

            <!-- Přidán poster image pro okamžité LCP a fetchpriority pro zrychlení načtení -->
            <video 
                autoplay 
                muted 
                loop 
                playsinline 
                poster="assets/ortnb_preview.jpg" 
                class="video-bg" 
                fetchpriority="low"
                preload="metadata">
                <source src="assets/ortnb_about_desktop.webm" type="video/webm">
            </video>
            <div class="video-overlay"></div>
            <div class="hero-content">
                <span class="hero-tag">Tradice od roku 1994</span>
                <h1>STAVÍME STROJE,<br>KTERÉ TVOŘÍ BUDOUCNOST</h1>
                <p>Prohlédněte si naše zázemí a proces výroby, kde se rodí špičková automatizační řešení.</p>
            </div>
            <div class="scroll-indicator" onclick="window.scrollTo({ top: window.innerHeight, behavior: 'smooth' })">
                <span>Scroll</span>
                <span class="material-symbols-outlined">expand_more</span>
            </div>
        </section>

        <app-bento-grid :cards="cards"></app-bento-grid>

        <app-footer :is-dark-mode="isDarkMode"></app-footer>
    </div>

    <script src="app/data.js"></script>
    <script src="app/app.js"></script>
</body>
</html>
