<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pronájem kapacit | ORT Nový Bydžov</title>
    <meta name="description" content="Nabízíme volné kapacity našeho strojního vybavení a montážních prostor pro vaše projekty.">

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="assets/styles.css">
    <link rel="stylesheet" href="assets/animations.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0&display=block" />
</head>
<body>
    <div id="app" v-cloak>
        <app-navbar 
            :is-dark-mode="isDarkMode" 
            :is-scrolled="isScrolled" 
            :is-menu-open="isMenuOpen" 
            :nav-items="navItems" 
            :active-section="activeSection"
            :scroll-progress="scrollProgress"
            @toggle-theme="toggleTheme" 
            @toggle-menu="toggleMenu" 
            @close-menu="closeMenu">
        </app-navbar>

        <header class="hero">
            <app-hero-coordinates :data="coords"></app-hero-coordinates>

            <div class="hero-content">
                <span class="hero-tag">Precizní technologie pro vaše potřeby</span>
                <h1>PRONÁJEM KAPACIT</h1>
                <p>Využijte naše špičkově vybavené dílny a zkušený personál pro vaši zakázkovou výrobu.</p>
            </div>
            <div class="hero-image">
                <img src="assets/robot-abb.png" alt="Průmyslový robot ABB">
            </div>

            <div class="scroll-indicator" onclick="window.scrollTo({ top: window.innerHeight, behavior: 'smooth' })">
                <span>Scroll</span>
                <span class="material-symbols-outlined">expand_more</span>
            </div>
        </header>

        <app-bento-grid :cards="cards"></app-bento-grid>

        <app-contact-form 
            title="Poptat volné kapacity" 
            description="Zajímá vás spolupráce nebo pronájem strojního času? Napište nám své požadavky a my se vám ozveme zpět.">
        </app-contact-form>

        <app-footer :is-dark-mode="isDarkMode"></app-footer>
    </div>

    <script src="app/data.js"></script>
    <script src="app/app.js"></script>
</body>
</html>
