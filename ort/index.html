<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORT Nový Bydžov | Inženýrská dokonalost</title>
    <meta name="description" content="ORT Nový Bydžov - Špičková inženýrská řešení, automatizace a stavba jednoúčelových strojů pro automotive a Průmysl 4.0.">

    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link rel="stylesheet" href="assets/styles.css">
    <link rel="stylesheet" href="assets/animations.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,300,0,0&display=block" />
</head>
<body>
    <div id="app" v-cloak>
        <app-navbar 
            :is-dark-mode="isDarkMode" 
            :is-scrolled="isScrolled" 
            :is-menu-open="isMenuOpen" 
            :nav-items="navItems" 
            :active-section="activeSection"
            :scroll-progress="scrollProgress"
            @toggle-theme="toggleTheme" 
            @toggle-menu="toggleMenu" 
            @close-menu="closeMenu">
        </app-navbar>

        <header class="hero">
            <app-hero-coordinates :data="coords"></app-hero-coordinates>

            <div class="hero-content">
                <span class="hero-tag">{{ hero.tag }}</span>
                <h1 class="hero-title-vertical">
                    <span v-html="hero.title"></span>
                    <div v-if="hero.rotating" class="rotating-text-wrapper">
                        <ul class="rotating-text-list">
                            <li v-for="item in hero.rotating" :key="item">{{ item }}</li>
                        </ul>
                    </div>
                </h1>
                <p>{{ hero.desc }}</p>
                <div class="hero-actions" v-if="hero.cta">
                    <a :href="hero.cta.link" class="hero-cta">{{ hero.cta.text }}</a>
                </div>
            </div>
            <div class="hero-image">
                <img src="assets/robot-abb.png" alt="Průmyslový robot ABB">
            </div>
            <div class="scroll-indicator" onclick="window.scrollTo({ top: window.innerHeight, behavior: 'smooth' })">
                <span>Scroll</span>
                <span class="material-symbols-outlined">expand_more</span>
            </div>
        </header>

        <app-bento-grid :cards="cards"></app-bento-grid>
        <app-contact-form></app-contact-form>

        <app-footer :is-dark-mode="isDarkMode"></app-footer>
    </div>

    <script src="app/data.js"></script>
    <script src="app/app.js"></script>
</body>
</html>
